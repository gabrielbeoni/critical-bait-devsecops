
name: Pipeline DevSecOps - Critical Bait

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: "01 - Gitleaks (Secrets)"
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o codigo do repositorio
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Instalar o Gitleaks
      - name: Instalar Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          curl -fSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz

          sudo tar -xzf /tmp/gitleaks.tar.gz \
            -C /usr/local/bin gitleaks

          /usr/local/bin/gitleaks version

      # 3. Analisar o historico Git
      - name: Analisar secrets
        shell: bash
        run: |
          mkdir -p reports

          /usr/local/bin/gitleaks git \
            --report-format json \
            --report-path reports/gitleaks.json \
            --exit-code 1 \
            .

      # 4. Publicar o relatorio da analise
      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-gitleaks
          path: reports/gitleaks.json
          if-no-files-found: warn
