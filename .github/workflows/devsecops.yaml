
name: Pipeline DevSecOps - Critical Bait

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # ETAPA 1 - GITLEAKS (DETECCAO DE SECRETS)
  # ==========================================
  gitleaks:
    name: "01 - Gitleaks (Secrets)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          curl -fSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz

          sudo tar -xzf /tmp/gitleaks.tar.gz \
            -C /usr/local/bin gitleaks

          /usr/local/bin/gitleaks version

      - name: Analisar secrets
        shell: bash
        run: |
          mkdir -p reports

          /usr/local/bin/gitleaks git \
            --report-format json \
            --report-path reports/gitleaks.json \
            --exit-code 1 \
            .

      - name: Publicar relatorio Gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-gitleaks
          path: reports/gitleaks.json
          if-no-files-found: warn

  # ==========================================
  # ETAPA 2 - SEMGREP (ANALISE SAST)
  # ==========================================
  semgrep:
    name: "02 - Semgrep (SAST)"
    needs: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        shell: bash
        run: |
          python -m pip install semgrep
          semgrep --version

      - name: Analisar codigo
        shell: bash
        run: |
          mkdir -p reports

          semgrep scan \
            --config auto \
            --json \
            --output reports/semgrep.json \
            --error \
            .

      - name: Publicar relatorio Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semgrep
          path: reports/semgrep.json
          if-no-files-found: warn
