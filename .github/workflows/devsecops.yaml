
name: Pipeline DevSecOps - Critical Bait

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # ETAPA 1 - GITLEAKS (SECRETS)
  # ==========================================
  gitleaks:
    name: "01 - Gitleaks (Secrets)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          curl -fSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz

          sudo tar -xzf /tmp/gitleaks.tar.gz \
            -C /usr/local/bin gitleaks

          gitleaks version

      - name: Analisar secrets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          gitleaks git \
            --report-format json \
            --report-path reports/gitleaks.json \
            --exit-code 1 \
            .

      - name: Publicar relatorio Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-gitleaks
          path: reports/gitleaks.json
          if-no-files-found: warn

  # ==========================================
  # ETAPA 2 - SEMGREP (SAST)
  # ==========================================
  semgrep:
    name: "02 - Semgrep (SAST)"
    needs: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install semgrep
          semgrep --version

      - name: Analisar codigo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          semgrep scan \
            --config auto \
            --json \
            --output reports/semgrep.json \
            --error \
            .

      - name: Publicar relatorio Semgrep
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-semgrep
          path: reports/semgrep.json
          if-no-files-found: warn

  # ==========================================
  # ETAPA 3 - BUILD E EMPACOTAMENTO
  # ==========================================
  build:
    name: "03 - Build e Empacotamento"
    needs: semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -d assets/css
          test -d assets/js

          echo "Arquivos essenciais encontrados."

      - name: Preparar build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp index.html dist/
          cp -R assets dist/

          for file in favicon.ico robots.txt manifest.json; do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done

          echo "Build preparado com sucesso."
          find dist -type f | sort

      - name: Gerar pacote ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          zip -r ../critical-bait-build.zip .
          cd ..

          test -s critical-bait-build.zip

          echo "Pacote ZIP criado com sucesso."

      - name: Publicar artefato do build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-bait-build
          path: critical-bait-build.zip
          if-no-files-found: error
          retention-days: 30

  # ==========================================
  # ETAPA 4 - TRIVY (SCA)
  # ==========================================
  trivy_sca:
    name: "04 - Trivy (SCA)"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Instalar Trivy
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.69.3"

          curl -fSL --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          sudo tar -xzf /tmp/trivy.tar.gz \
            -C /usr/local/bin trivy

          trivy --version

      - name: Analisar dependencias e vulnerabilidades
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          trivy fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --format json \
            --output reports/trivy-sca.json \
            --exit-code 1 \
            .

      - name: Publicar relatorio Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-trivy-sca
          path: reports/trivy-sca.json
          if-no-files-found: warn

  # ==========================================
  # ETAPA 5 - DOCKER E GHCR
  # ==========================================
  docker_ghcr:
    name: "05 - Docker e GHCR"
    needs: trivy_sca
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Definir nome da imagem
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "Imagem: $IMAGE"

      - name: Construir imagem Docker
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --tag "$IMAGE:latest" \
            .

          docker image inspect "$IMAGE:${GITHUB_SHA}"

      - name: Testar servidor Nginx
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name critical-bait-test \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE:${GITHUB_SHA}"

          trap 'docker rm -f critical-bait-test' EXIT

          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/ \
              -o /tmp/critical-bait-index.html; then

              echo "Aplicacao respondendo na porta 8080."
              exit 0
            fi

            sleep 2
          done

          docker logs critical-bait-test
          exit 1

      - name: Autenticar no GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publicar imagem no GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

          echo "Imagem publicada: $IMAGE:latest"
          echo "Versao do commit: $IMAGE:${GITHUB_SHA}"

  # ==========================================
  # ETAPA 6 - TRIVY CONTAINER SCAN
  # ==========================================
  trivy_container:
    name: "06 - Trivy Container Scan"
    needs: docker_ghcr
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Definir nome da imagem
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Instalar Trivy
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.69.3"

          curl -fSL --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          sudo tar -xzf /tmp/trivy.tar.gz \
            -C /usr/local/bin trivy

          trivy --version

      - name: Autenticar no GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Construir imagem para pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --tag "$IMAGE:${GITHUB_SHA}" \
            .

      - name: Baixar imagem publicada
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$IMAGE:${GITHUB_SHA}"

      - name: Analisar vulnerabilidades da imagem
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output reports/trivy-container.json \
            --exit-code 1 \
            "$IMAGE:${GITHUB_SHA}"

      - name: Publicar relatorio Trivy Container
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-trivy-container
          path: reports/trivy-container.json
          if-no-files-found: warn
          retention-days: 30
