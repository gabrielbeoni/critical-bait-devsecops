
name: Pipeline DevSecOps - Critical Bait

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # ETAPA 1 - GITLEAKS (DETECCAO DE SECRETS)
  # ==========================================
  gitleaks:
    name: "01 - Gitleaks (Secrets)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          curl -fSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz

          sudo tar -xzf /tmp/gitleaks.tar.gz \
            -C /usr/local/bin gitleaks

          /usr/local/bin/gitleaks version

      - name: Analisar secrets
        shell: bash
        run: |
          mkdir -p reports

          /usr/local/bin/gitleaks git \
            --report-format json \
            --report-path reports/gitleaks.json \
            --exit-code 1 \
            .

      - name: Publicar relatorio Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-gitleaks
          path: reports/gitleaks.json
          if-no-files-found: warn

  # ==========================================
  # ETAPA 2 - SEMGREP (ANALISE SAST)
  # ==========================================
  semgrep:
    name: "02 - Semgrep (SAST)"
    needs: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        shell: bash
        run: |
          python -m pip install semgrep
          semgrep --version

      - name: Analisar codigo
        shell: bash
        run: |
          mkdir -p reports

          semgrep scan \
            --config auto \
            --json \
            --output reports/semgrep.json \
            --error \
            .

      - name: Publicar relatorio Semgrep
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-semgrep
          path: reports/semgrep.json
          if-no-files-found: warn

  # ==========================================
  # ETAPA 3 - BUILD E EMPACOTAMENTO
  # ==========================================
  build:
    name: "03 - Build e Empacotamento"
    needs: semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -d assets/css
          test -d assets/js

          echo "Arquivos essenciais encontrados."

      - name: Preparar build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp index.html dist/
          cp -R assets dist/

          # Copiar outros arquivos estaticos da raiz,
          # caso existam.
          for file in favicon.ico robots.txt manifest.json; do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done

          echo "Build preparado com sucesso."
          find dist -type f | sort

      - name: Gerar pacote ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          zip -r ../critical-bait-build.zip .
          cd ..

          test -s critical-bait-build.zip

          echo "Pacote ZIP criado com sucesso."

      - name: Publicar artefato do build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-bait-build
          path: critical-bait-build.zip
          if-no-files-found: error
          retention-days: 30
